<!doctype html><html lang="es"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Escudo de espera · Selección</title><style>body{margin:0;background:#101a24}.arcade{width:min(100%,1280px);height:640px;position:relative;margin:auto}#finish{display:block;margin:16px auto;padding:12px 20px}</style><div class="arcade"><section id="selection" class="menu selection" aria-labelledby="selection-title">
            <div class="selection-heading"><div><p class="eyebrow">ELIGE QUIÉN SALE A LA CALLE</p><h2 id="selection-title">¿CON QUIÉN VAS?</h2></div><button id="ranking-open" type="button">RANKING</button><button id="back">VOLVER</button></div>
            <p class="selection-hint">CLIC EN TU PERSONAJE PARA JUGAR · ← → ELEGIR · ENTER JUGAR</p>
            <div class="fighter-options">
              <button class="fighter-card" data-pick="office" aria-pressed="true"><img data-portrait="office" alt="Gomelord en posición de combate"><strong>GOMELORD</strong><span>Para él, de la 72 en adelante es el sur.</span></button>
              <button class="fighter-card" data-pick="student" aria-pressed="false"><img data-portrait="student" alt="Maca Demia en posición de combate"><strong>MACA DEMIA</strong><span>Debe más materias que semestres.</span></button>
              <button class="fighter-card" data-pick="teleperforman" aria-pressed="false"><img data-portrait="teleperforman" alt="Teleperforman con su diadema"><strong>TELEPERFORMAN</strong><span>Experto en fastidiar con ofertas telefónicas.</span></button>
              <button class="fighter-card" data-pick="gymbro" aria-pressed="false"><img data-portrait="gymbro" alt="Gymbro en posición de combate"><strong>GYMBRO</strong><span>Los gains son su vida, la pechuga de pollo su delirio.</span></button>
              <button class="fighter-card" data-pick="magolita" aria-pressed="false"><img data-portrait="magolita" alt="Magolita en posición de combate"><strong>MAGOLITA</strong><span>Dispuesta a limpiar la ciudad a escobazos.</span></button>
            </div>
          </section></div><button id="finish">Completar carga de prueba</button><script type="module">
import '../src/style.css';
import '@fontsource/ibm-plex-mono/latin-600.css';
import '@fontsource/barlow-condensed/latin-900.css';
import {SelectScreen} from '../src/ui/SelectScreen.js';
import background from '../src/data/players/fondo_players.png?url';
document.documentElement.style.setProperty('--selection-art',`url(${background})`);
const keys=['office','student','teleperforman','gymbro','magolita'];
keys.forEach((key,i)=>document.querySelector(`[data-portrait="${key}"]`).src=`/src/data/players/player_${i+1}_profile.png`);
const screen=new SelectScreen({root:document.querySelector('#selection'),paletteState:{selected:{}},modeLabel:()=> 'VISTA DE CARGA'});
const realSheet=screen.sheet.bind(screen);screen.sheet=()=>new Promise(()=>{});
for(const button of document.querySelectorAll('[data-pick]'))button.onclick=()=>screen.show(button.dataset.pick);
screen.show('gymbro');
document.querySelector('#finish').onclick=()=>{screen.sheet=realSheet;screen.drawIdle();};
</script></html>
